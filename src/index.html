<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angular Elements Demo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <h1>Angular Elements Demo</h1>
  <p>Esta es una demostración de Angular Elements como Custom Elements</p>
  
  <!-- Custom Element creado con Angular -->
  <my-custom-element name="Pedro" message="¡Hola desde Angular Elements!"></my-custom-element>
  
  <br><br>
  
  <!-- Otro ejemplo del mismo componente -->
  <my-custom-element name="Usuario" message="Este es otro ejemplo del custom element"></my-custom-element>
  
  <script>
    // Ejemplo de cómo usar el custom element desde JavaScript
    setTimeout(() => {
      const customElement = document.createElement('my-custom-element');
      customElement.setAttribute('name', 'Dinámico');
      customElement.setAttribute('message', 'Creado dinámicamente con JavaScript');
      document.body.appendChild(customElement);
    }, 2000);
  </script>
</body>
</html>
